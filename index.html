<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="./manifest.json">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
.app{max-width:700px;margin:auto;height:100vh;display:flex;flex-direction:column}
header{padding:18px 16px;border-bottom:1px solid #252631;display:flex;justify-content:space-between;align-items:center}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:#888}
#chat{flex:1;overflow:auto;padding:16px}.msg{max-width:85%;padding:12px 14px;margin:10px 0;border-radius:16px;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:#5b5ce2}.ai{background:#191b22}
footer{padding:10px;border-top:1px solid #252631;display:flex;gap:8px}
textarea{flex:1;background:#15161d;color:white;border:1px solid #30323d;border-radius:14px;padding:12px;resize:none;min-height:48px}
button{border:0;border-radius:14px;padding:0 16px;background:#fff;color:#111;font-weight:700}
#settings{display:none;padding:16px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#15161d;color:#fff}
</style>
</head>
<body>
<div class="app">
<header><div><h1>◈ NEXUS AI</h1><div class="sub">Your personal AI assistant</div></div><button onclick="toggleSettings()">⚙</button></header>
<div id="chat"><div class="msg ai">Hello. I'm NEXUS AI. Configure your AI endpoint in ⚙ Settings, then ask me anything.</div></div>
<div id="settings">
<h2>Settings</h2>
<div class="field"><label>API URL</label><input id="url" placeholder="https://your-api.example/v1/chat/completions"></div>
<div class="field"><label>Model</label><input id="model" placeholder="your-model"></div>
<div class="field"><label>API Key</label><input id="key" type="password" placeholder="sk-..."></div>
<button onclick="saveSettings()" style="padding:12px 18px">Save</button>
<button onclick="toggleSettings()" style="padding:12px 18px">Back</button>
</div>
<footer><textarea id="input" placeholder="Message NEXUS AI..."></textarea><button onclick="send()">Send</button></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function toggleSettings(){let s=$("settings"),c=$("chat");let show=s.style.display!=="block";s.style.display=show?"block":"none";c.style.display=show?"none":"block"}
$("url").value=localStorage.url||"";$("model").value=localStorage.model||"";$("key").value=localStorage.key||"";
function saveSettings(){localStorage.url=$("url").value.trim();localStorage.model=$("model").value.trim();localStorage.key=$("key").value.trim();alert("Saved");}
function add(text,who){let d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;return d}
async function send(){
 let text=$("input").value.trim();if(!text)return;$("input").value="";add(text,"user");
 let u=localStorage.url,k=localStorage.key,m=localStorage.model;
 if(!u||!k||!m){add("Please open ⚙ Settings and add your API URL, model, and API key.","ai");return}
 let wait=add("Thinking…","ai");
 try{let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},body:JSON.stringify({model:m,messages:[{role:"user",content:text}]})});
 let data=await r.json();if(!r.ok)throw new Error(data.error?.message||"Request failed");
 wait.textContent=data.choices?.[0]?.message?.content||"No response returned.";
 }catch(e){wait.textContent="Error: "+e.message+"\n\nNote: browser API requests may be blocked by CORS. A secure backend is recommended for the next version."}
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
